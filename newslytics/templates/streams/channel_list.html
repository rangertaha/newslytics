{% extends "base.html" %}

{% block title %}Streams — Newslytics{% endblock %}

{% block content %}
<h1>Stream channels</h1>
<ul class="object-list">
  {% for channel in object_list %}
  <li><a href="{% url 'streams:detail' channel.pk %}">{{ channel.name|default:channel.endpoint }}</a></li>
  {% empty %}
  <li>No stream channels configured.</li>
  {% endfor %}
</ul>
{% endblock %}
