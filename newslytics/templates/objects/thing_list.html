{% extends "base.html" %}

{% block title %}Things — Newslytics{% endblock %}

{% block content %}
<h1>Things</h1>
<ul class="object-list">
  {% for thing in object_list %}
  <li><a href="{% url 'objects:detail' thing.pk %}">{{ thing.title }}</a></li>
  {% empty %}
  <li>No things yet.</li>
  {% endfor %}
</ul>
{% endblock %}
